<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Login or register to RetailTrend, the modern SaaS ecommerce analytics platform."/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body class="auth-page">

    <!-- Auth Container -->
    <div class="auth-container">

      <!-- Logo / Branding -->
      <div class="auth-logo">
        <div class="logo-icon">📈</div>
        <h1>RetailTrend</h1>
        <p>Smart Analytics for Modern Commerce</p>
      </div>

<div class="auth-card">

<h2 style="color:white;">Sign in to continue</h2>

<button type="button" onclick="loginWithGoogle()" class="google-btn">

<img src="https://developers.google.com/identity/images/g-logo.png" width="18">

Continue with Google

</button>

<div class="auth-message" id="login-msg"></div>

</div><!-- /.auth-card -->

      <!-- Footer note -->
      <p style="text-align:center; color:#475569; font-size:0.78rem; margin-top:20px;">
        🔒 Your account is securely protected using Supabase authentication
      </p>

    </div><!-- /.auth-container -->

  <script>
    const supabaseUrl = "https://jxwsumcnvdzxipysyqtn.supabase.co";
    const supabaseKey = "sb_publishable_OtIyP7HLqu-lsMhgq5hzfw_bgzmtbQs";

    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // GOOGLE LOGIN
async function loginWithGoogle() {

  const { data, error } = await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/dashboard.html"
    }
  });

  if (error) {
    showMsg('login-msg', error.message, 'error');
  }
}
    /* ============================================================
       Auth Page JavaScript
       Handles: tab switching, login, registration, localStorage
    ============================================================ */

    // --- Show message helper ---
    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'auth-message ' + type;
    }

async function checkSession(){

const { data } = await supabaseClient.auth.getSession()

if(data.session){
window.location.href = "dashboard.html"
}

}

checkSession();
</script>
</body>
</html>
